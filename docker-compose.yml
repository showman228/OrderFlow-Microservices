services:
  catalog_service:
    build:
      context: .
      dockerfile: catalog_service/Dockerfile
    container_name: catalog_service
    restart: unless-stopped
    env_file:
      - catalog_service/.env
    ports:
      - "8000:8000"
    depends_on:
      catalog_db:
        condition: service_healthy
        restart: true
    
  catalog_db:
    image: postgres:16-alpine
    container_name: catalog_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-catalog_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-catalog_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  order_service:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    container_name: order_service
    restart: unless-stopped
    env_file:
      - order_service/.env
    ports:
      - "8001:8000"
    depends_on:
      order_db:
        condition: service_healthy
        restart: true
  
  order_db:
    image: postgres:16-alpine
    container_name: order_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-order_db}
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-order_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  order_postgres_data: