services:
  catalog_service:
    build:
      context: .
      dockerfile: catalog_service/Dockerfile
    container_name: catalog_service
    restart: unless-stopped
    env_file:
      - catalog_service/.env
    ports:
      - "8000:8000"
    depends_on:
      catalog_db:
        condition: service_healthy
        restart: true
    
  catalog_db:
    image: postgres:16-alpine
    container_name: catalog_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-catalog_db}
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-catalog_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  order_service:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    container_name: order_service
    restart: unless-stopped
    env_file:
      - order_service/.env
    ports:
      - "8001:8001"
    depends_on:
      order_db:
        condition: service_healthy
        restart: true
      order_redis:
        condition: service_healthy
        restart: true
  
  order_db:
    image: postgres:16-alpine
    container_name: order_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-order_db}
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-order_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  
  order_redis:
    image: redis:8.10-alpine
    container_name: order_redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret_key_for_redis}
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  user_service:
    build:
      context: .
      dockerfile: user_service/Dockerfile
    container_name: user_service
    restart: unless-stopped
    env_file:
      - user_service/.env
    ports:
      - "8002:8002"
    depends_on:
      user_db:
        condition: service_healthy
        restart: true

  user_db:
    image: postgres:16-alpine
    container_name: user_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-user_db}
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-user_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  catalog_postgres_data:
  order_postgres_data:
  redis-data:
    driver: local
  user_postgres_data:
